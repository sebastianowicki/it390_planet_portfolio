apiVersion: apps/v1
kind: Deployment
metadata:
  name: galaxy
  labels: {app: galaxy}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: galaxy}
  template:
    metadata:
      labels: {app: galaxy}
    spec:
      # Without this, Kubernetes adds REDIS_PORT=tcp://10.96.x.x:6379 for the redis Service,
      # and the app can't turn that into a port number. See Day 4.
      enableServiceLinks: false
      containers:
        - name: galaxy
          # Always a sha- tag from CI, never latest. Change it with: kubectl set image deploy/galaxy galaxy=...
          image: ghcr.io/YOUR-GITHUB-USER/galaxy:sha-0000000
          ports:
            - containerPort: 8000
          env:
            - {name: GALAXY_OWNER, value: "Sebastian"}
            - {name: GALAXY_COLOR, value: "#3fa7c4"}
            - {name: ENVIRONMENT, value: "kubernetes"}
            - {name: REDIS_HOST, value: "redis"}   # the redis Service's name
            - {name: REDIS_PORT, value: "6379"}
            - name: POD_NAME                     # Kubernetes fills in this pod's own name
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: galaxy
spec:
  selector: {app: galaxy}
  ports:
    - port: 80
      targetPort: 8000
